infra_profile = "lightweight"

[engine]
max_turns = 50
max_tokens = 200000
max_turns_per_subgoal = 8
max_consecutive_failures = 3
max_critic_invocations = 5
stagnation_turns = 3
verify_pass_threshold = 70
default_mode = "goal"
default_access = "auto"

[models]
planner = "mistralai/mistral-large-3-675b-instruct-2512"
verifier = "mistralai/mistral-large-3-675b-instruct-2512"
critic = "microsoft/phi-4-mini-instruct"

[permissions]
auto_execute_tiers = [ "read_only", "write_local",]
approval_required_tiers = [ "destructive",]

[sandbox]
whitelisted_domains = [ "registry.npmjs.org", "github.com", "api.github.com", "pypi.org", "files.pythonhosted.org",]

[prompt_guard]
# Prompt-size guard: trim context before LLM call if estimated tokens > this
# percentage of MODEL_CONTEXT_LIMIT (8192). Phase 6 default: 80%
context_limit_tokens = 8192
trim_threshold_pct = 80

[mcp_servers.github]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-github"]
tools.include = ["list_issues", "create_issue", "search_code"]
auto_execute = false
