[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "markly"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
markly = "markly.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markly*"]
