[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "markly"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langgraph>=0.2.0",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.13.0",
    "openai>=1.30.0",
    "python-dotenv>=1.0.0",
    "docker>=7.1.0",
    "playwright>=1.61.0",
    "duckduckgo-search>=8.1.1",
    "beautifulsoup4>=4.15.0",
    "requests>=2.34.2",
    "typer>=0.26.8",
    "textual>=8.2.8",
    "pyrage>=1.3.0",
    "toml>=0.10.2",
    "plyer>=2.1.0",
    "mcp>=1.28.1",
]

[project.scripts]
markly = "markly.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["markly*"]
