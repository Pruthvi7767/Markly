name: Markly Eval Suite

on:
  pull_request:
    branches: [develop]

jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      - name: Install Playwright browsers
        run: uv run playwright install chromium --with-deps

      - name: Run Markly eval (fast mode — N=1)
        run: |
          uv run python -m markly eval --fast --tasks T01,T06,T03,T08,T07 \
            --report workspace/eval_report_ci.md
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}

      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            workspace/eval_report_ci.md
            workspace/eval_report_ci.json
            workspace/eval_runs/
